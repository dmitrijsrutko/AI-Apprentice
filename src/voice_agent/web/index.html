<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Apprentice</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1c1c1a; --muted: #6b6b66; --line: #e3e2dd;
    --user: #1c1c1a; --user-fg: #fbfbfa; --agent: #ffffff;
    --off: #c0392b; --live: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #eceae6; --muted: #8a8a84; --line: #2b2b31;
      --user: #eceae6; --user-fg: #16161a; --agent: #1f1f25;
      --off: #ef6f61; --live: #4caf7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  header strong { color: var(--fg); font-size: 13px; }
  /* min-height:0 is load-bearing: a flex item defaults to min-height:auto,
     so without it #log grows to fit its content and the page scrolls off the
     bottom instead of the log scrolling inside itself. */
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-fg); border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
  .error { align-self: center; color: #c0392b; font-size: 13px; text-align: center; }
  .cursor::after { content: "▍"; opacity: .5; }
  form { border-top: 1px solid var(--line); padding: 12px 16px; }
  .row { max-width: 700px; margin: 0 auto; display: flex; gap: 8px; }
  #input {
    flex: 1; min-width: 0; padding: 10px 13px; font: inherit; color: inherit;
    background: var(--agent); border: 1px solid var(--line); border-radius: 10px;
  }
  #input:focus { outline: 2px solid var(--fg); outline-offset: -1px; }
  button {
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--user); color: var(--user-fg); border: 0; border-radius: 10px;
  }
  button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
  .chip {
    padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 999px;
    background: transparent; color: var(--fg); border: 1px solid var(--line);
  }
  /* The header's three groups: what you can watch, the call itself, leaving it.
     A group wraps onto its own line as a whole, never split. */
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  /* Framed, so it still reads as its own section when the header wraps. */
  .group.obs { border: 1px dashed var(--line); border-radius: 999px; padding: 3px 3px 3px 10px; }
  .caption { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; cursor: help; }
  .ctl { display: inline-flex; align-items: center; gap: 6px; }
  .ico {
    width: 14px; height: 14px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  /* Mic and speaker say what is true now: the plain icon when on, crossed out
     and red when off. Only the attribute changes; CSS picks the icon. */
  .ctl[aria-checked="true"] .ico-off, .ctl[aria-checked="false"] .ico-on { display: none; }
  .ctl[aria-checked="false"]:not(:disabled) {
    color: var(--off); border-color: color-mix(in srgb, var(--off) 50%, transparent);
    background: color-mix(in srgb, var(--off) 10%, transparent);
  }
  .ctl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: none; }
  .ctl.live .dot { display: inline-block; }
  /* Solid buttons keep the darker red and green in both themes: white on the
     dark theme's lighter tints is too faint. */
  .end-session { margin-left: 10px; background: #c0392b; color: #fff; border-color: #c0392b; }
  .end-session:disabled { background: transparent; color: var(--muted); border-color: var(--line); }
  /* Observability: the checkbox stays (it is what bindSwitch reads and
     remembers), hidden; its label is the chip. */
  .toggle { position: relative; display: inline-block; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .toggle:has(input:checked) { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .toggle:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: 1px; }
  .msg.volatile { opacity: .55; font-style: italic; }
  .note.think { opacity: .45; font-size: 11.5px; font-style: italic; }
  .tag { display: block; font-size: 11px; opacity: .5; margin-top: 4px; }
  body:not(.stats) .telemetry { display: none; }
  body:not(.thoughts) .thought { display: none; }
  body:not(.eyes) .seen { display: none; }
  /* What the eyes saw: one line per changed frame, the whole screen on a click. */
  .seen { align-self: stretch; font-size: 12px; color: var(--muted); max-width: 100%; }
  .seen summary { cursor: pointer; list-style: none; text-align: center; }
  .seen summary::-webkit-details-marker { display: none; }
  .seen[open] summary { color: var(--fg); }
  .seen .screen {
    margin: 6px auto 2px; max-width: 34em; padding: 8px 10px; text-align: left;
    border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap;
  }
  .chip.sharing { background: #2e7d4f; color: #fff; border-color: #2e7d4f; }
  /* The apprentice's flow: capture, then the map, then teaching. */
  #flow { max-width: 700px; margin: 0 auto 8px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  #flow .f-step { color: var(--muted); }
  #flow .f-step.now { color: var(--fg); font-weight: 600; }
  #flow .f-step.done { color: #2e7d4f; }
  #flow .f-sep { color: var(--muted); opacity: .5; }
  #flow .f-gap { margin-left: auto; }
  #flow a { color: var(--fg); }
  #flow button { padding: 6px 12px; font-size: 12.5px; }
  /* The Work Map. */
  .workmap, .mapwait { align-self: stretch; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .workmap header { font-size: 15px; margin-bottom: 4px; }
  .m-summary { color: var(--muted); margin: 0 0 8px; font-size: 13.5px; }
  .m-steps { list-style: none; margin: 0; padding: 0; }
  .m-step { position: relative; margin: 0 0 14px; }
  .m-step:not(:last-child)::after { content: "↓"; position: absolute; left: 11px; bottom: -14px; color: var(--muted); font-size: 12px; }
  .m-step summary { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; list-style: none; padding: 6px; border-radius: 8px; }
  .m-step summary::-webkit-details-marker { display: none; }
  .m-step summary:hover, .m-step details[open] summary { background: var(--agent); }
  .m-n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .m-head { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .m-decision { font-size: 13px; color: var(--muted); }
  .m-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .m-chip { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .m-judgment { border-color: #b8860b; }
  .m-gap { color: #c0392b; }
  .m-thumb { flex: none; width: 96px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .m-body { padding: 6px 6px 4px 40px; font-size: 13.5px; }
  .m-shot img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .m-body p { margin: 6px 0; }
  .m-rails { margin: 4px 0; padding-left: 16px; }
  .m-kind { font-size: 11.5px; font-weight: 600; }
  q.unverified { text-decoration: underline dotted; }
  .m-gaps { margin-top: 6px; font-size: 13px; }
  .m-gaps ul { margin: 4px 0; padding-left: 18px; }
  .workmap footer, .m-progress { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .m-wait { margin: 0; }
  .workmap.updating { opacity: .6; }
  .mastery ul { margin: 4px 0 8px; padding-left: 18px; font-size: 13.5px; }
  .t-caught li { color: #b5521b; }
  .m-step.focus summary { outline: 2px solid #b8860b; }
  /* Who holds the floor, by the server's VAD: the last 12 s, newest on the right. */
  #floor { position: relative; height: 14px; border-bottom: 1px solid var(--line); overflow: hidden; }
  #floor span {
    position: absolute; top: 0; bottom: 0; font-size: 9.5px; line-height: 14px;
    color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden;
  }
  #floor .floor-speaking { background: var(--fg); opacity: .55; }
  #floor .floor-echo { background: #c0392b; }
  #floor .floor-micro_pause { background: #e0b44c; opacity: .35; }
  #floor .floor-pause { background: #e0b44c; opacity: .7; color: #1c1c1a; }
  .unheard { opacity: .4; }
  /* The start screen: what this is, what it will do, and the one button that
     begins it. Removed from the page once pressed. */
  #start { align-self: center; text-align: center; width: 100%; max-width: 34em; min-width: 0; padding: 28px 0 8px; }
  #start h1 { font-size: 17px; margin: 0 0 6px; }
  #start p { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  #start .notice { font-size: 13px; color: var(--muted); margin: 10px 0; }
  #start .notice strong { color: var(--fg); }
  #start .notice:empty { display: none; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
  .timer.urgent { color: #c0392b; }
  #again { margin: 8px auto 0; display: block; }
  #begin { margin-top: 14px; padding: 12px 26px; font-size: 15px; }
  /* The stack this conversation will run on. Radios rather than a dropdown:
     the whole point is that the alternatives are visible. */
  .pick { margin: 14px 0; text-align: left; }
  .pick > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  /* Equal cells: two per line where they fit, one on a phone. */
  .pick .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 6px; }
  .pick label {
    display: flex; align-items: flex-start; gap: 8px; cursor: pointer; min-width: 0;
    padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px;
  }
  .pick label input { margin: 4px 0 0; flex: none; }
  .pick label > span { min-width: 0; overflow-wrap: anywhere; }
  .pick label:has(:checked) { border-color: var(--fg); }
  .pick label small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  /* Models: one provider per line, always — the provider's name in a column
     of its own and its models in three equal cells, so the rows line up. */
  .pick .rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: center; }
  .pick .row { display: contents; }
  .pick .row > b { font-size: 12px; font-weight: 600; color: var(--muted); }
  .pick .row .opts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* The judge's ruling: one card under the transcript. */
  .verdict {
    align-self: stretch; background: var(--agent); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.5;
  }
  .verdict.win { border-color: #2e8b57; }
  .verdict.lose { border-color: #c0392b; }
  .verdict p { margin: 6px 0; }
  .verdict h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .v-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .v-outcome { font-size: 28px; font-weight: 800; letter-spacing: .02em; }
  .win .v-outcome { color: #2e8b57; }
  .lose .v-outcome { color: #c0392b; }
  .v-badge { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .v-split { display: flex; height: 26px; margin: 10px 0; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 600; }
  .v-split .you { background: var(--fg); color: var(--bg); padding: 4px 8px; white-space: nowrap; min-width: max-content; }
  .v-split .adv { flex: 1; background: var(--line); padding: 4px 8px; text-align: right; white-space: nowrap; }
  .v-headline { font-weight: 600; font-size: 15px; }
  .v-muted, .verdict footer { color: var(--muted); font-size: 12.5px; }
  .verdict footer { margin-top: 14px; }
  .v-stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .v-stats span { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .verdict dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; margin: 0; }
  .verdict dt { color: var(--muted); }
  .verdict dd { margin: 0; }
  .v-row { display: grid; grid-template-columns: 7.5em 1fr 1.6em; gap: 2px 8px; align-items: center; margin-bottom: 8px; }
  .v-row small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .v-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .v-bar i { display: block; height: 100%; background: var(--fg); }
  .v-at { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .v-moment { margin: 8px 0; }
  .v-moment q { display: block; font-style: italic; margin: 2px 0; }
  .v-moment p { margin: 0; color: var(--muted); font-size: 13px; }
  .verdict ol, .verdict ul { margin: 4px 0; padding-left: 20px; }
  .v-fun { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); }
  /* The wait for a ruling: as visible as the card that will replace it. */
  .verdict.pending { text-align: center; font-size: 16px; padding: 20px 16px; }
  .v-wait { font-weight: 600; }
  .v-progress {
    font: 15px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums; color: var(--muted); white-space: pre;
  }
  .v-scale { display: inline-block; animation: v-pulse 1.6s ease-in-out infinite; }
  @keyframes v-pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .v-scale { animation: none; } }
  #again:disabled { cursor: progress; }

  @media (max-width: 480px) {
    header { gap: 6px 10px; padding: 8px 12px; }
    #log { padding: 14px 12px; }
    form { padding: 10px 12px; }
    #start { padding-top: 16px; }
    /* The provider's name above its row: beside it, three cells get too narrow. */
    .pick .rows { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .pick .row > b { margin-top: 6px; }
    .pick .row label { padding: 7px 7px; gap: 5px; font-size: 13px; }
    .msg { max-width: 90%; }
  }
</style>
<!-- What this agent is, written in by the server (`server.with_facts`). The
     start screen has to say what beginning entails before there is a socket
     to ask over; an empty object means a page served some other way. -->
<script id="facts" type="application/json">{}</script>
</head>
<body>
  <header>
    <strong>AI-Apprentice</strong>
    <span id="meta">connecting…</span>
    <span id="status"></span>
    <span id="timer" class="timer" hidden></span>
    <span style="margin-left:auto;"></span>
    <div class="group obs" role="group" aria-label="Observability">
      <span class="caption" title="Show what happens under the hood — for debugging, not needed to talk">Observability</span>
      <label class="chip toggle" title="Timings, tokens and the floor strip"><input type="checkbox" id="stats">stats</label>
      <label class="chip toggle" title="What the agent considered saying"><input type="checkbox" id="thoughts">thoughts</label>
      <label class="chip toggle" title="What the eyes saw on your shared screen"><input type="checkbox" id="eyes">eyes</label>
    </div>
    <div class="group call" role="group" aria-label="Call">
      <button type="button" id="listen" class="chip ctl" role="switch" aria-checked="false" aria-label="Mic" title="Microphone: whether the apprentice hears you" disabled><svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg><svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 2 20 20"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><path d="M12 19v3"/></svg><span class="label">Mic off</span><span class="dot"></span></button>
      <button type="button" id="speaker" class="chip ctl" role="switch" aria-checked="true" aria-label="Speaker" title="Speaker: whether you hear the apprentice — off, it still talks, silently, and its words still light up"><svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg><svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg><span class="label">Speaker on</span></button>
      <button type="button" id="share" class="chip ctl" hidden title="Share a screen, window or tab with the apprentice"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 10 3-3 3 3"/><path d="M12 13V7"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></svg><span class="label">Share screen</span></button>
      <button type="button" id="end" class="chip ctl end-session" disabled title="End this session — the conversation stops and cannot be resumed"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><path d="M22 2 2 22"/></svg><span class="label">End session</span></button>
    </div>
  </header>

  <div id="floor" class="telemetry" aria-hidden="true"></div>
  <div id="log"><div class="wrap" id="wrap">
    <div id="start">
      <h1>AI-Apprentice</h1>
      <p>For now, the voice it is built on: it speaks, it listens while it speaks, and you can talk over it.</p>
      <div id="start-stack"></div>
      <div id="start-notices"></div>
      <button type="button" id="begin">Start conversation</button>
      <p style="margin-top:10px;">Your microphone will be asked for, and turned on.</p>
    </div>
  </div></div>

  <form id="form">
    <div id="flow" hidden>
      <span class="f-step" data-phase="capture">① Capture</span><span class="f-sep">▸</span>
      <span class="f-step" data-phase="map">② Map</span><span class="f-sep">▸</span>
      <span class="f-step" data-phase="teach">③ Teach</span>
      <a id="tomap" href="#workmap" hidden>🗺 map</a>
      <button type="button" id="flowNext" class="f-gap">Finish capture ▶</button>
    </div>
    <div class="row">
      <input id="input" autocomplete="off" placeholder="Ask something…" autofocus>
      <button id="send" type="submit">Send</button>
    </div>
  </form>

<!-- Native ES modules, no build step: app.js wires the others together.
     Served from /static by server.py. -->
<script type="module" src="/static/app.js"></script>
</body>
</html>
